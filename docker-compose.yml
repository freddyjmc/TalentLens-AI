services:
  streamlit:
    build: .
    container_name: streamlit_app
    restart: unless-stopped
    ports:
      - "8501:8501"
    env_file: .env  # claves de OpenAI y Adzuna
    environment:
      # Dentro de Docker, MongoDB se alcanza por el nombre del servicio (tiene prioridad sobre el .env)
      MONGODB_URI: mongodb://mongodb:27017/
      MONGODB_DB_NAME: asistente
    depends_on:
      - mongodb

  mongodb:
    image: mongo:6.0
    container_name: mongodb_asistente
    restart: unless-stopped
    ports:
      # Solo accesible desde este equipo: MongoDB no tiene contraseña en este entorno local
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
